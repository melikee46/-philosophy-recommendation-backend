version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: philosophy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: philosophy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d philosophy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: philosophy_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/philosophy_db?schema=public"
      JWT_ACCESS_SECRET: "super-secret-access-key-change-in-production"
      JWT_REFRESH_SECRET: "super-secret-refresh-key-change-in-production"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
